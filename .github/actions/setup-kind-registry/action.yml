name: Setup kind registry
description: Create kind cluster with local registry and wait for it
inputs:
  registry-port:
    description: Local registry port
    required: false
    default: "5000"
outputs:
  local-registry:
    description: Local registry address from kind
    value: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
runs:
  using: composite
  steps:
    - name: start kind
      id: kind
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        version: v0.33.0
        kubectl_version: v1.34.11
        node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
        registry: true
        registry_name: kind-registry
        registry_port: ${{ inputs.registry-port }}
    - name: Capture runner and kind resources
      uses: ./.github/actions/kind-diagnostics
      if: always()
    - name: wait for registry
      shell: bash
      run: |
        for i in {1..20}; do
          if curl -sSf "http://${{ steps.kind.outputs.LOCAL_REGISTRY }}/v2/" > /dev/null; then
            exit 0
          fi
          sleep 2
        done
        curl -sS "http://${{ steps.kind.outputs.LOCAL_REGISTRY }}/v2/" || true
        exit 1
